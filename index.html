        let view = 'gallery', idx = 0;

        function renderGallery() {
            const gal = document.getElementById('gallery');
            gal.innerHTML = '';
            db.forEach((item, i) => {
                const d = document.createElement('div');
                d.className = 'gallery-item';
                d.onclick = () => showSingle(i);
                d.innerHTML = '<img src="' + item.filename + '" loading="lazy"><div class="item-badge">' + item.short_label + '</div>';
                gal.appendChild(d);
            });
            document.title = "Rugose coral Schlotheimophyllum patellatum (Schlotheim, 1820)";
        }

        function toggleView() { view === 'gallery' ? showSingle(0) : showGallery(); }
        
        function showSingle(i) {
            view = 'single'; idx = i;
            document.getElementById('gallery').classList.add('hidden');
            document.getElementById('single').style.display = 'flex';
            document.querySelector('.toggle-btn').innerText = 'Widok Galerii';
            updateSingle();
        }

        function showGallery() {
            view = 'gallery';
            document.getElementById('single').style.display = 'none';
            document.getElementById('gallery').classList.remove('hidden');
            document.querySelector('.toggle-btn').innerText = 'Tryb Pojedynczy';
            document.getElementById('header-text').innerHTML = "Rugose coral <i>Schlotheimophyllum patellatum</i> (Schlotheim, 1820), Upper Visby Beds (Silurian) of Gotland (Sweden) - University of Silesia collection (GIUS)";
            document.title = "Rugose coral Schlotheimophyllum patellatum (Schlotheim, 1820)";
            const items = document.getElementsByClassName('gallery-item');
            if(items[idx]) { items[idx].scrollIntoView({ block: 'center' }); }
        }

        function updateSingle() {
            const item = db[idx];
            document.getElementById('big-img').src = item.filename;
            document.getElementById('header-text').innerHTML = '<i>Schlotheimophyllum patellatum</i> - section ' + (idx + 1) + ' of ' + db.length + ' - image ' + item.name;
            document.title = 'Schlotheimophyllum patellatum - section ' + (idx + 1) + ' of ' + db.length + ' - image ' + item.name;
            
            let html = '';
            html += '<div class="info-item"><span class="label">NAME:</span><span class="value">' + item.name + '</span></div>';
            html += '<div class="info-item"><span class="label">FULL ID:</span><span class="value">' + item.full_id + '</span></div>';
            html += '<div class="info-item"><span class="label">TYPE:</span><span class="value">' + item.type + '</span></div>';
            html += '<div class="info-item"><span class="label">RESOLUTION:</span><span class="value">' + item.resolution + '</span></div>';
            html += '<div class="info-item"><span class="label">PICTURE TYPE:</span><span class="value">' + item.picture_type + '</span></div>';
            html += '<div class="info-item"><span class="label">SAMPLING SITE:</span><span class="value">' + item.sampling_site + '</span></div>';
            document.getElementById('info').innerHTML = html;
        }

        function navSingle(dir) { idx = (idx + dir + db.length) % db.length; updateSingle(); }

        document.addEventListener('keydown', e => {
            if(view === 'single') {
                if(e.key === 'ArrowLeft') navSingle(-1);
                if(e.key === 'ArrowRight') navSingle(1);
                if(e.key === 'Escape') showGallery();
            }
        });

        window.onload = renderGallery;
    </script>
